<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Planner</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header><h1>Family Planner</h1><button id="logout" hidden>Log out</button></header>
      <p id="notice" role="status"></p>
      <section id="login">
        <p>Your family’s tasks and plans—in one conversation.</p>
        <div id="auth-providers"></div>
      </section>
      <section id="chat" hidden>
        <label
          class="consent"><input type="checkbox" id="consent"> I agree to send my chat and open tasks’ names, short descriptions, locations, priorities and dates (saved full descriptions are not sent) to OpenRouter and its model provider. When online search is enabled, generated search queries may also go to OpenRouter’s search provider. Do not include secrets.</label>
        <label for="model">Model</label>
        <select id="model"></select>
        <div id="messages" role="log" aria-live="polite"
          aria-relevant="additions" aria-label="Conversation"></div>
        <form id="chat-form">
          <label for="prompt">Message</label>
          <textarea id="prompt" maxlength="4000" rows="3"
            placeholder="Add groceries at ICA, due Friday. What’s urgent today?"
            required></textarea>
          <label><input type="checkbox" id="online-search"> Use online search for this message (up to 3 results)</label>
          <button id="send" type="submit">Send</button>
        </form>
        <p
          class="hint">All task and schedule changes need an inline confirmation.</p>
      </section>
    </main>
  </body>
</html>
